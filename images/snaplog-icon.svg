<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Snap Log 앱 아이콘 (SVG 재현 버전) -->
  <defs>
    <radialGradient id="sl-bg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#0d2a55"/>
      <stop offset="0.55" stop-color="#071633"/>
      <stop offset="1" stop-color="#02060f"/>
    </radialGradient>
    <linearGradient id="sl-ring" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#39d8ff"/>
      <stop offset="0.5" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#7a3bf0"/>
    </linearGradient>
    <linearGradient id="sl-blade1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe4ff"/>
      <stop offset="1" stop-color="#2f7bff"/>
    </linearGradient>
    <linearGradient id="sl-blade2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fa8ff"/>
      <stop offset="1" stop-color="#2947d8"/>
    </linearGradient>
    <linearGradient id="sl-blade3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f78ff"/>
      <stop offset="1" stop-color="#6a2fd8"/>
    </linearGradient>
    <filter id="sl-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sl-softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#sl-bg)"/>

  <!-- 상단 은은한 광원 -->
  <ellipse cx="256" cy="64" rx="120" ry="48" fill="#3d9be0" opacity="0.18" filter="url(#sl-glow)"/>

  <!-- 바깥 글로우 링 -->
  <circle cx="256" cy="266" r="164" fill="none" stroke="url(#sl-ring)" stroke-width="10" filter="url(#sl-glow)" opacity="0.9"/>

  <!-- 금속 테두리 링 -->
  <circle cx="256" cy="266" r="152" fill="#0a1026"/>
  <circle cx="256" cy="266" r="152" fill="none" stroke="url(#sl-ring)" stroke-width="16"/>
  <circle cx="256" cy="266" r="136" fill="none" stroke="#101b3d" stroke-width="14"/>

  <!-- 소용돌이 셔터 블레이드 -->
  <g transform="translate(256 266)">
    <!-- 원판 전체를 채우는 3개의 곡선 부채꼴 -->
    <g>
      <path d="M0 0 C -22 -55 -22 -100 0 -130 A130 130 0 0 1 112 66 C 62 58 22 40 0 0 Z" fill="url(#sl-blade1)"/>
      <path d="M0 0 C -22 -55 -22 -100 0 -130 A130 130 0 0 1 112 66 C 62 58 22 40 0 0 Z" fill="url(#sl-blade2)" transform="rotate(120)"/>
      <path d="M0 0 C -22 -55 -22 -100 0 -130 A130 130 0 0 1 112 66 C 62 58 22 40 0 0 Z" fill="url(#sl-blade3)" transform="rotate(240)"/>
    </g>
    <!-- 소용돌이 구분선 -->
    <g stroke="#0a1026" stroke-width="10" fill="none" stroke-linecap="round">
      <path d="M0 0 C -22 -55 -22 -100 0 -130"/>
      <path d="M0 0 C -22 -55 -22 -100 0 -130" transform="rotate(120)"/>
      <path d="M0 0 C -22 -55 -22 -100 0 -130" transform="rotate(240)"/>
    </g>
    <!-- 안쪽 하이라이트 곡선 -->
    <g stroke="#bfe8ff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5">
      <path d="M-14 -34 C -26 -66 -24 -96 -6 -118"/>
      <path d="M-14 -34 C -26 -66 -24 -96 -6 -118" transform="rotate(120)"/>
      <path d="M-14 -34 C -26 -66 -24 -96 -6 -118" transform="rotate(240)"/>
    </g>
    <!-- 중심 소용돌이 -->
    <circle r="30" fill="#0c1533"/>
    <path d="M0 -26 C 19 -22 28 -5 21 12 C 14 -2 3 -7 -3 2 C -10 -10 -12 -21 0 -26 Z" fill="#4fa8ff"/>
    <path d="M0 -26 C 19 -22 28 -5 21 12 C 14 -2 3 -7 -3 2 C -10 -10 -12 -21 0 -26 Z" fill="#6a5cf0" transform="rotate(180)"/>
  </g>

  <!-- 렌즈 플레어 (좌하단) -->
  <g transform="translate(168 356)" filter="url(#sl-softglow)">
    <path d="M0 -34 L7 -7 L34 0 L7 7 L0 34 L-7 7 L-34 0 L-7 -7 Z" fill="#eaf7ff"/>
    <circle r="8" fill="#ffffff"/>
  </g>
</svg>
