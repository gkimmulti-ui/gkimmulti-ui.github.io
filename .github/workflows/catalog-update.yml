name: Refresh and verify homepage catalog
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: homepage-catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-play-scraper==1.2.7 Pillow==11.3.0 qrcode==8.2
      - run: python scripts/prepare-global-catalog.py
      - run: python scripts/refresh-store-screenshots.py
      - run: python scripts/generate-store-qr.py
      - run: node scripts/apply-global-copy.cjs
      - run: node scripts/build.cjs
      - run: python scripts/check-seo.py
      - run: node scripts/check-global.cjs
      - name: Save verified store source data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data images assets index.html apps en ja zh ru fil hi es pt fr de id sitemap.xml feed.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official catalog metadata and artwork [skip ci]'
            git push
          fi
