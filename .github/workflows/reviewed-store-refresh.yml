name: Reviewed store asset refresh
on:
  push:
    branches: [refresh/verified-store-20261125]
    paths: ['.github/workflows/reviewed-store-refresh.yml']
concurrency:
  group: reviewed-store-refresh-only
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  refresh:
    if: github.ref == 'refs/heads/refresh/verified-store-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install google-play-scraper==1.2.7 Pillow==11.3.0
      - run: python scripts/refresh-reviewed-gallery-20261125.py
      - run: node scripts/build.cjs
      - name: Commit generated catalog to reviewed branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/apps.json data/store-sources.json src/store-gallery-verified-20261125.json images/screenshots assets/catalog.js index.html sitemap.xml feed.xml data/page-manifest.json
          git add -- '*.html'
          git diff --cached --stat
          git commit -m 'Refresh verified public store gallery and localized descriptions'
          git push origin HEAD:refs/heads/refresh/verified-store-20261125
