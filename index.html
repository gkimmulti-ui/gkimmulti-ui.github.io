    :root {
      --primary: #4f6ef7;
      --primary-dark: #3a55d9;
      --accent: #8a5cf6;
      --text: #1c2333;
      --text-muted: #5b6478;
      --bg: #ffffff;
      --bg-soft: #f4f6fc;
      --border: #e8ebf3;
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Hiragino Sans", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
    }
    .container { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

    /* Header */
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      height: 64px; gap: 16px;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.25rem; font-weight: 800; color: var(--text);
      text-decoration: none; flex-shrink: 0;
    }
    .logo-mark {
      width: 38px; height: 38px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .nav-right { display: flex; align-items: center; gap: 24px; }
    .nav-links { display: flex; gap: 24px; }
    .nav-links a {
      color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 500;
    }
    .nav-links a:hover { color: var(--primary); }

    /* Language selector */
    .lang-select {
      display: flex; align-items: center; gap: 6px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
    }
    .lang-select .globe { font-size: 0.95rem; }
    .lang-select select {
      border: none; background: transparent;
      font-size: 0.88rem; font-weight: 600; color: var(--text);
      font-family: inherit;
      cursor: pointer; outline: none;
      -webkit-appearance: none; appearance: none;
      padding-right: 14px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%235b6478' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right center;
    }

    /* Hero */
    .hero {
      background: linear-gradient(180deg, var(--bg-soft) 0%, #ffffff 100%);
      padding: 88px 0 72px;
      text-align: center;
    }
    .hero .badge {
      display: inline-block;
      padding: 6px 16px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.85rem; font-weight: 600;
      color: var(--primary);
      margin-bottom: 24px;
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800; line-height: 1.25; letter-spacing: -0.02em;
    }
    .hero h1 .accent {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero p {
      margin: 20px auto 0; max-width: 620px;
      font-size: 1.1rem; color: var(--text-muted);
    }
    .hero .cta {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 36px;
      padding: 14px 32px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff; font-weight: 700; font-size: 1rem;
      border-radius: 12px; text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .hero .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(79, 110, 247, 0.35);
    }

    /* Sections */
    section { padding: 80px 0; }
    .section-title { text-align: center; }
    .section-title h2 {
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      font-weight: 800; letter-spacing: -0.02em;
    }
    .section-title p { margin-top: 12px; color: var(--text-muted); }

    /* App cards */
    .apps { background: var(--bg-soft); }
    .app-grid {
      margin-top: 48px;
      display: grid; gap: 28px;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    }
    .app-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      display: flex; flex-direction: column;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .app-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 36px rgba(28, 35, 51, 0.1);
    }
    .app-card .app-head {
      display: flex; align-items: center; gap: 16px;
    }
    .app-card .app-icon {
      width: 64px; height: 64px; border-radius: 16px;
      display: grid; place-items: center;
      font-size: 1.8rem;
      color: #fff;
      flex-shrink: 0;
      overflow: hidden;
    }
    .app-card .app-icon img { width: 100%; height: 100%; object-fit: cover; }
    .app-card .app-name h3 { font-size: 1.25rem; font-weight: 800; }
    .app-card .app-name .category {
      font-size: 0.82rem; color: var(--text-muted); font-weight: 500;
    }
    .app-card .app-desc {
      margin-top: 16px;
      color: var(--text-muted); font-size: 0.95rem;
      flex-grow: 1;
    }
    .app-card .app-tags {
      margin-top: 14px;
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .app-card .app-tags span {
      font-size: 0.78rem; font-weight: 600;
      color: var(--primary);
      background: rgba(79, 110, 247, 0.08);
      padding: 4px 10px; border-radius: 999px;
    }
    .app-card .app-links {
      margin-top: 20px;
      display: flex; gap: 10px;
    }
    .store-btn {
      flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 12px;
      background: #111527; color: #fff;
      border-radius: 10px; text-decoration: none;
      font-size: 0.85rem; font-weight: 600;
      transition: opacity 0.15s ease;
    }
    .store-btn:hover { opacity: 0.85; }
    .store-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .store-btn.disabled {
      background: #eceff5; color: #9aa3b5;
      pointer-events: none;
    }

    /* About */
    .about-grid {
      margin-top: 48px;
      display: grid; gap: 24px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }
    .about-card {
      background: var(--bg-soft);
      border-radius: var(--radius);
      padding: 32px 28px;
      text-align: center;
    }
    .about-card .icon { font-size: 2rem; margin-bottom: 14px; }
    .about-card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
    .about-card p { color: var(--text-muted); font-size: 0.92rem; }

    /* Contact CTA */
    .contact-cta {
      text-align: center;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 24px;
      padding: 64px 32px;
      color: #fff;
      margin: 0 24px;
    }
    .contact-cta h2 { font-size: clamp(1.6rem, 3.5vw, 2.2rem); font-weight: 800; }
    .contact-cta p { margin-top: 12px; opacity: 0.9; }
    .contact-cta a {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 28px;
      padding: 13px 30px;
      background: #fff; color: var(--text);
      font-weight: 700; border-radius: 12px; text-decoration: none;
      transition: transform 0.15s ease;
    }
    .contact-cta a:hover { transform: translateY(-2px); }

    /* Footer */
    footer {
      margin-top: 80px;
      border-top: 1px solid var(--border);
      padding: 32px 0;
      text-align: center;
      color: var(--text-muted); font-size: 0.9rem;
    }
    footer a { color: var(--text-muted); }

    @media (max-width: 720px) {
      .nav-links { display: none; }
      .hero { padding: 64px 0 48px; }
      section { padding: 56px 0; }
    }

    /* ============================================================
       렌더링 로직 (수정할 필요 없음)
       ============================================================ */
    const SUPPORTED = ["en", "ko", "ja", "zh", "ru", "fil"];
    const HTML_LANG = { en: "en", ko: "ko", ja: "ja", zh: "zh-CN", ru: "ru", fil: "fil" };

    let lang = localStorage.getItem("kennethapp-lang");
    if (!SUPPORTED.includes(lang)) {
      const nav = (navigator.language || "en").toLowerCase();
      lang =
        nav.startsWith("ko") ? "ko" :
        nav.startsWith("ja") ? "ja" :
        nav.startsWith("zh") ? "zh" :
        nav.startsWith("ru") ? "ru" :
        (nav.startsWith("fil") || nav.startsWith("tl")) ? "fil" : "en";
    }

    function t(key) {
      return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || "";
    }

    function localized(value) {
      if (value == null) return "";
      if (typeof value === "string" || Array.isArray(value)) return value;
      return value[lang] ?? value.en ?? value.ko ?? Object.values(value)[0] ?? "";
    }

    const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3.61 1.81C3.23 2.2 3 2.8 3 3.58v16.84c0 .78.23 1.38.62 1.76l.1.09 9.44-9.43v-.22L3.71 1.72l-.1.09z" fill="#00D7FE"/><path d="M16.3 15.99l-3.14-3.15v-.22l3.15-3.15.07.04 3.73 2.12c1.06.6 1.06 1.59 0 2.2l-3.73 2.12-.08.04z" fill="#FFCE00"/><path d="M16.38 15.95L13.16 12.7 3.61 22.18c.35.37.93.42 1.58.05l11.19-6.28" fill="#FF3A44"/><path d="M16.38 8.5L5.19 2.22c-.65-.37-1.23-.32-1.58.05l9.55 9.48 3.22-3.25z" fill="#00F076"/></svg>';
    const APPLE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>';

    function storeButton(url, svg, label) {
      if (url === null) return "";
      if (url) {
        return '<a class="store-btn" href="' + url + '" target="_blank" rel="noopener">' + svg + '<span>' + label + '</span></a>';
      }
      return '<span class="store-btn disabled">' + svg + '<span>' + t("store.soon") + '</span></span>';
    }

    function iconHtml(app) {
      if (app.icon && (app.icon.includes("/") || app.icon.includes("."))) {
        return '<div class="app-icon"><img src="' + app.icon + '" alt="' + localized(app.name) + '" /></div>';
      }
      return '<div class="app-icon" style="background:' + (app.iconBg || "linear-gradient(135deg, #4f6ef7, #8a5cf6)") + '">' + (app.icon || "📱") + '</div>';
    }

    function renderApps() {
      document.getElementById("app-grid").innerHTML = APPS.map(function (app) {
        return (
          '<div class="app-card">' +
            '<div class="app-head">' +
              iconHtml(app) +
              '<div class="app-name"><h3>' + localized(app.name) + '</h3><div class="category">' + localized(app.category) + '</div></div>' +
            '</div>' +
            '<p class="app-desc">' + localized(app.desc) + '</p>' +
            '<div class="app-tags">' + localized(app.tags).map(function (tag) { return "<span>" + tag + "</span>"; }).join("") + '</div>' +
            '<div class="app-links">' +
              storeButton(app.playUrl, PLAY_SVG, "Google Play") +
              storeButton(app.appStoreUrl, APPLE_SVG, "App Store") +
            '</div>' +
          '</div>'
        );
      }).join("");
    }

    function render() {
      document.documentElement.lang = HTML_LANG[lang];
      document.title = t("meta.title");
      document.querySelector('meta[name="description"]').setAttribute("content", t("meta.desc"));
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        el.textContent = t(el.getAttribute("data-i18n"));
      });
      renderApps();
      document.getElementById("lang-picker").value = lang;
    }

    document.getElementById("lang-picker").addEventListener("change", function (e) {
      lang = e.target.value;
      localStorage.setItem("kennethapp-lang", lang);
      render();
    });

    render();
  </script>
