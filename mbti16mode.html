  :root{

  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0B0E1F; --panel:#12162B; --ink:#E9ECF6; --muted:#A5ABC0;
           --line:#23294A; --violet:#B9A9FF; --blue:#37B8FF; --chip:#1B2140; }

  :root[data-theme="light"]{ --bg:#F5F6FB; --panel:#FFFFFF; --ink:#1B1E2E; --muted:#5A607A;
           --line:#E4E6F0; --violet:#6A48F5; --blue:#1E92E6; --chip:#EFEEFB; }
  :root[data-theme="dark"]{ --bg:#0B0E1F; --panel:#12162B; --ink:#E9ECF6; --muted:#A5ABC0;
           --line:#23294A; --violet:#B9A9FF; --blue:#37B8FF; --chip:#1B2140; }

  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif;
        line-height:1.65; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:720px; margin:0 auto; padding:44px 22px 96px; }
  .eyebrow{ letter-spacing:.14em; text-transform:uppercase; font-size:12px; font-weight:700; color:var(--violet); }
  h1{ font-size:clamp(26px,5vw,34px); line-height:1.15; margin:8px 0 4px; text-wrap:balance; }
  .meta{ color:var(--muted); font-size:14px; margin:0 0 18px; }
  .meta a{ color:var(--blue); text-decoration:none; }
  .langs{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 26px; }
  .langs button{ font:inherit; font-size:13px; font-weight:600; cursor:pointer;
    color:var(--muted); background:transparent; border:1px solid var(--line);
    border-radius:999px; padding:6px 13px; transition:.15s; }
  .langs button:hover{ color:var(--ink); }
  .langs button[aria-pressed="true"]{ color:#fff; background:var(--violet); border-color:var(--violet); }
  @media (prefers-color-scheme: dark){ .langs button[aria-pressed="true"]{ color:#0B0E1F; } }
  :root[data-theme="dark"] .langs button[aria-pressed="true"]{ color:#0B0E1F; }
  .langs button:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
  .summary{ background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--violet);
            border-radius:14px; padding:16px 18px; margin:6px 0 30px; }
  h2{ font-size:16px; margin:30px 0 8px; }
  h2 .n{ color:var(--violet); font-variant-numeric:tabular-nums; margin-right:8px; }
  p{ margin:8px 0; } ul{ margin:8px 0; padding-left:20px; } li{ margin:3px 0; }
  code{ background:var(--chip); border:1px solid var(--line); padding:1px 7px; border-radius:6px; font-size:.9em; }
  hr{ border:0; border-top:1px solid var(--line); margin:30px 0 14px; }
  .foot{ color:var(--muted); font-size:13px; }
  strong{ color:var(--ink); }
</style>
</head>

const langsEl = document.getElementById("langs");

function render(code){
  const t = T[code] || T.en;

  document.getElementById("h1").textContent = t.title;
  document.getElementById("eff").textContent = t.eff;
  let html = '<div class="summary"><strong>'+t.sumL+'</strong> '+t.sum+'</div>';
  t.s.forEach(function(sec, i){
    html += '<h2><span class="n">'+(i+1)+'</span>'+sec[0]+'</h2>';
    html += '<p>'+sec[1]+'</p>';
    if(sec.length>2 && Array.isArray(sec[2])){
      html += '<ul>'+sec[2].map(function(li){return '<li>'+li+'</li>';}).join('')+'</ul>';
      if(sec[3]) html += '<p>'+sec[3]+'</p>';
    }
  });
  docEl.innerHTML = html;
  Array.prototype.forEach.call(langsEl.children, function(b){
    b.setAttribute("aria-pressed", b.dataset.code===code ? "true" : "false");
  });
}
LANGS.forEach(function(l){
  const b = document.createElement("button");
  b.textContent = l[1]; b.dataset.code = l[0];
  b.addEventListener("click", function(){ render(l[0]); });
  langsEl.appendChild(b);
});
const nav = (navigator.language||"en").slice(0,2);
render(T[nav] ? nav : "en");
</script>
