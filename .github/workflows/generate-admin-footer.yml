name: Generate administrator footer
on:
  push:
    branches: [fix/admin-footer-static-20261125]
    paths: ['.github/workflows/generate-admin-footer.yml']
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/fix/admin-footer-static-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.cjs
      - run: |
          node -e "const fs=require('fs');const locales=['ko','en','ja','zh','ru','fil','hi','es','pt','fr','de','id'];for(const l of locales){const p=l==='ko'?'index.html':l+'/index.html';const t=fs.readFileSync(p,'utf8');if(!t.includes('id=\"admin-dashboard-link\" href=\"https://kenneth-app-dashboard.gkimmulti.workers.dev/\"'))throw Error(p);}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' assets/catalog.js data/page-manifest.json sitemap.xml feed.xml
          git commit -m 'Generate localized administrator footer pages'
          git push origin HEAD:refs/heads/fix/admin-footer-static-20261125
