<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 부조금관리 by 마음장부 앱 아이콘 (SVG 재현 버전) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf4ec"/>
      <stop offset="1" stop-color="#fbe9e2"/>
    </linearGradient>
    <linearGradient id="env" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f79cb0"/>
      <stop offset="1" stop-color="#f0839c"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- 좌우 장식 잎사귀 -->
  <g opacity="0.85">
    <path d="M56 310 q8 -60 2 -115" stroke="#a8c3a0" stroke-width="6" stroke-linecap="round" fill="none"/>
    <ellipse cx="42" cy="235" rx="17" ry="9" fill="#b7d0ae" transform="rotate(-35 42 235)"/>
    <ellipse cx="74" cy="215" rx="17" ry="9" fill="#b7d0ae" transform="rotate(30 74 215)"/>
    <ellipse cx="40" cy="278" rx="15" ry="8" fill="#c5dabd" transform="rotate(-30 40 278)"/>
    <path d="M456 318 q-8 -55 -2 -108" stroke="#b9a7e0" stroke-width="6" stroke-linecap="round" fill="none"/>
    <ellipse cx="470" cy="248" rx="16" ry="9" fill="#c9b6ec" transform="rotate(35 470 248)"/>
    <ellipse cx="438" cy="228" rx="16" ry="9" fill="#c9b6ec" transform="rotate(-30 438 228)"/>
    <ellipse cx="472" cy="290" rx="14" ry="8" fill="#d8c9f2" transform="rotate(28 472 290)"/>
  </g>

  <!-- 제목 -->
  <text x="256" y="122" text-anchor="middle"
        font-family="'BM Jua','Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="82" font-weight="900" fill="#e94f66"
        stroke="#ffffff" stroke-width="14" paint-order="stroke" stroke-linejoin="round">부조금관리</text>

  <!-- 지폐 (봉투 뒤) -->
  <g transform="rotate(-14 150 210)">
    <rect x="82" y="168" width="150" height="86" rx="12" fill="#c9a5f2"/>
    <rect x="96" y="181" width="122" height="60" rx="8" fill="#dcc4f8"/>
    <circle cx="157" cy="211" r="22" fill="#c9a5f2"/>
  </g>
  <g transform="rotate(10 372 200)">
    <rect x="296" y="156" width="150" height="86" rx="12" fill="#cbaaf3"/>
    <rect x="310" y="169" width="122" height="60" rx="8" fill="#e0cbf9"/>
    <text x="371" y="212" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#a887d8">5000</text>
  </g>

  <!-- 봉투 뒷면 플랩 -->
  <path d="M116 262 L256 168 L396 262 Z" fill="#ee7791"/>

  <!-- 편지 -->
  <rect x="176" y="196" width="160" height="150" rx="14" fill="#fffdfa"/>
  <path d="M256 238 c-9 -14 -30 -12 -34 3 c-3 12 12 24 34 39 c22 -15 37 -27 34 -39 c-4 -15 -25 -17 -34 -3 Z" fill="#ec5a70"/>
  <g stroke="#f2c9cf" stroke-width="8" stroke-linecap="round">
    <line x1="204" y1="302" x2="308" y2="302"/>
    <line x1="216" y1="324" x2="296" y2="324"/>
  </g>

  <!-- 봉투 본체 -->
  <path d="M112 268 q0 -14 14 -14 h260 q14 0 14 14 v118 q0 26 -26 26 h-236 q-26 0 -26 -26 Z" fill="url(#env)"/>
  <path d="M112 262 L256 372 L400 262 L400 386 q0 26 -26 26 h-236 q-26 0 -26 -26 Z" fill="#f48ca4"/>
  <path d="M112 262 L256 372 L400 262" fill="none" stroke="#e86d8a" stroke-width="6" stroke-linecap="round"/>

  <!-- 봉투 위 하트 -->
  <path d="M256 356 c-7 -11 -24 -9 -27 2 c-3 10 10 20 27 32 c17 -12 30 -22 27 -32 c-3 -11 -20 -13 -27 -2 Z" fill="#e94f66"/>

  <!-- 왼쪽 아래 하트들 -->
  <path d="M96 404 c-10 -15 -33 -12 -37 4 c-3 14 14 27 37 43 c23 -16 40 -29 37 -43 c-4 -16 -27 -19 -37 -4 Z" fill="#ec5a70"/>
  <path d="M148 448 c-6 -9 -19 -7 -21 2 c-2 8 8 15 21 24 c13 -9 23 -16 21 -24 c-2 -9 -15 -11 -21 -2 Z" fill="#f2889b"/>

  <!-- 오른쪽 아래 달력 -->
  <g>
    <rect x="360" y="368" width="104" height="96" rx="14" fill="#fffdfa"/>
    <rect x="360" y="368" width="104" height="30" rx="14" fill="#ee6d84"/>
    <rect x="360" y="384" width="104" height="14" fill="#ee6d84"/>
    <g stroke="#d8506b" stroke-width="6" stroke-linecap="round">
      <line x1="380" y1="360" x2="380" y2="376"/>
      <line x1="404" y1="360" x2="404" y2="376"/>
      <line x1="428" y1="360" x2="428" y2="376"/>
      <line x1="450" y1="360" x2="450" y2="376"/>
    </g>
    <circle cx="392" cy="428" r="15" fill="#f6b5c2"/>
    <text x="392" y="436" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="800" fill="#ffffff">₩</text>
    <path d="M436 424 c-5 -8 -17 -6 -19 2 c-2 7 7 13 19 21 c12 -8 21 -14 19 -21 c-2 -8 -14 -10 -19 -2 Z" fill="#ec5a70"/>
  </g>

  <!-- 봉투 옆 동전 -->
  <circle cx="130" cy="384" r="26" fill="#f6b5c2"/>
  <text x="130" y="394" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#ffffff">₩</text>
</svg>
