name: Sync homepage from KennethApp

# KennethApp 저장소의 홈페이지를 이곳(루트 사이트)으로 자동 복사합니다.
# 리뉴얼 이후 홈페이지는 이 저장소에서 직접 관리합니다.
# 필요할 때만 Actions에서 명시적으로 확인하고 예전 원본을 가져올 수 있습니다.
# 자동 복사를 다시 켜면 현재 홈페이지와 images/ 전체가 덮어써집니다.
# 별도의 토큰/시크릿 설정이 필요 없습니다 (원본 저장소가 공개이므로).

on:
  workflow_dispatch:
    inputs:
      confirm_overwrite:
        description: 'Overwrite the redesigned homepage with the KennethApp source'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: sync-homepage
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ inputs.confirm_overwrite == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this site
        uses: actions/checkout@v4

      - name: Fetch homepage from KennethApp
        run: |
          git clone --depth 1 https://github.com/gkimmulti-ui/KennethApp.git /tmp/kennethapp

      - name: Copy homepage files
        run: |
          # index.html, images/, 그리고 검색엔진용 robots.txt / sitemap.xml 을 교체합니다.
          # app-ads.txt, lotto.html 등 이 저장소 고유 파일은 건드리지 않습니다.
          rm -rf images
          cp /tmp/kennethapp/index.html ./index.html
          cp -r /tmp/kennethapp/images ./images
          cp /tmp/kennethapp/.nojekyll ./.nojekyll
          # robots.txt 와 sitemap.xml 은 크롤러가 도메인 루트에서만 찾으므로 이곳이 정본입니다
          cp /tmp/kennethapp/robots.txt ./robots.txt
          cp /tmp/kennethapp/sitemap.xml ./sitemap.xml

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "변경 사항 없음 — 건너뜁니다."
            exit 0
          fi
          git add -A
          git commit -m "Sync homepage from KennethApp@$(git -C /tmp/kennethapp rev-parse --short HEAD)"
          git push
